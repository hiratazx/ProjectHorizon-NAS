name: Build and Release

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: hiratazx/projecthorizon

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag build: use tag name (e.g., v1.0.0-beta)
            VERSION="${{ github.ref_name }}"
            IS_RELEASE="true"
            
            # Determine version type
            if [[ "$VERSION" == *"-alpha"* ]]; then
              VERSION_TYPE="alpha"
            elif [[ "$VERSION" == *"-beta"* ]]; then
              VERSION_TYPE="beta"
            elif [[ "$VERSION" == *"-staging"* ]] || [[ "$VERSION" == *"-preview"* ]]; then
              VERSION_TYPE="preview"
            else
              VERSION_TYPE="stable"
            fi
          else
            # Push/manual build: use shortcommit-branch
            SHORT_COMMIT=$(git rev-parse --short HEAD)
            BRANCH=${GITHUB_REF_NAME//\//-}
            VERSION="${SHORT_COMMIT}-${BRANCH}"
            IS_RELEASE="false"
            VERSION_TYPE="dev"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "version_type=${VERSION_TYPE}" >> $GITHUB_OUTPUT
          echo "short_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.GitCommit=${{ steps.version.outputs.short_commit }} -X main.VersionType=${{ steps.version.outputs.version_type }}" \
            -o build/horizon-linux-amd64 ./cmd/horizon
          
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.GitCommit=${{ steps.version.outputs.short_commit }} -X main.VersionType=${{ steps.version.outputs.version_type }}" \
            -o build/horizon-linux-arm64 ./cmd/horizon

      - name: Upload artifacts (non-release)
        if: steps.version.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: horizon-${{ steps.version.outputs.version }}
          path: build/horizon-*
          retention-days: 30

      - name: Create Release (tag builds)
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: build/horizon-*
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.version_type != 'stable' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.is_release == 'true' && steps.version.outputs.version_type == 'stable' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.short_commit }}
            VERSION_TYPE=${{ steps.version.outputs.version_type }}
