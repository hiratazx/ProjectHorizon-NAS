name: Build and Release

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: hiratazx/projecthorizon

jobs:
  # Determine version info (shared between jobs)
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      version_type: ${{ steps.version.outputs.version_type }}
      short_commit: ${{ steps.version.outputs.short_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            IS_RELEASE="true"
            
            if [[ "$VERSION" == *"-alpha"* ]]; then
              VERSION_TYPE="alpha"
            elif [[ "$VERSION" == *"-beta"* ]]; then
              VERSION_TYPE="beta"
            elif [[ "$VERSION" == *"-staging"* ]] || [[ "$VERSION" == *"-preview"* ]]; then
              VERSION_TYPE="preview"
            else
              VERSION_TYPE="stable"
            fi
          else
            SHORT_COMMIT=$(git rev-parse --short HEAD)
            BRANCH=${GITHUB_REF_NAME//\//-}
            VERSION="${SHORT_COMMIT}-${BRANCH}"
            IS_RELEASE="false"
            VERSION_TYPE="dev"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "version_type=${VERSION_TYPE}" >> $GITHUB_OUTPUT
          echo "short_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  # Build binaries (parallel with docker)
  binary:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=${{ needs.version.outputs.version }} -X main.GitCommit=${{ needs.version.outputs.short_commit }} -X main.VersionType=${{ needs.version.outputs.version_type }}" \
            -o build/horizon-linux-amd64 ./cmd/horizon
          
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X main.Version=${{ needs.version.outputs.version }} -X main.GitCommit=${{ needs.version.outputs.short_commit }} -X main.VersionType=${{ needs.version.outputs.version_type }}" \
            -o build/horizon-linux-arm64 ./cmd/horizon

      - name: Upload artifacts (non-release)
        if: needs.version.outputs.is_release == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: horizon-${{ needs.version.outputs.version }}
          path: build/horizon-*
          retention-days: 30

      - name: Create Release (tag builds)
        if: needs.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: build/horizon-*
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.version_type != 'stable' }}

  # Build and push Docker image (parallel with binary)
  docker:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.is_release == 'true' && needs.version.outputs.version_type == 'stable' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            GIT_COMMIT=${{ needs.version.outputs.short_commit }}
            VERSION_TYPE=${{ needs.version.outputs.version_type }}
